name: PhoenixBank Deployment

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: phoenixbank-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-images:
    name: Publish service images to GHCR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/phoenixbank-backend
          - name: payments
            context: ./payments
            dockerfile: ./payments/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/phoenixbank-payments
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/phoenixbank-frontend
          - name: fraud-detection
            context: ./fraud-detection
            dockerfile: ./fraud-detection/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/phoenixbank-fraud-detection
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest