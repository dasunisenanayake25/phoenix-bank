name: PhoenixBank CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: phoenixbank-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Filesystem security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan repository with Trivy
        run: docker run --rm -v "${{ github.workspace }}:/repo" aquasec/trivy:latest fs --severity CRITICAL --ignore-unfixed --exit-code 1 /repo

  node-services:
    name: Node service checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            path: backend
            lint: npx eslint "{src,apps,libs,test}/**/*.ts"
            test: npm test -- --runInBand
            build: npm run build
          - name: payments
            path: payments
            lint: npx eslint "{src,apps,libs,test}/**/*.ts"
            test: npm test -- --runInBand
            build: npm run build
          - name: frontend
            path: frontend
            lint: npm run lint
            test: ""
            build: npm run build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Audit dependencies
        working-directory: ${{ matrix.path }}
        run: npm audit --audit-level=critical

      - name: Lint
        if: ${{ matrix.lint != '' }}
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.lint }}

      - name: Test
        if: ${{ matrix.test != '' }}
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.test }}

      - name: Build
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.build }}

  python-service:
    name: Fraud detection checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fraud-detection
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fraud-detection/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip pip-audit && pip install -r requirements.txt

      - name: Security audit
        run: pip-audit -r requirements.txt

      - name: Syntax check
        run: python -m compileall main.py

  docker-builds:
    name: Docker build verification
    runs-on: ubuntu-latest
    needs: [security-scan, node-services, python-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker compose file
        run: docker compose -f docker-compose.secure.yml -f docker-compose.dev.yml config

      - name: Build backend image
        run: docker build -t phoenix-backend:ci ./backend

      - name: Build payments image
        run: docker build -t phoenix-payments:ci ./payments

      - name: Build frontend image
        run: docker build -t phoenix-frontend:ci ./frontend

      - name: Build fraud detection image
        run: docker build -t phoenix-fraud-detection:ci ./fraud-detection
